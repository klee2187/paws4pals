<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paws4Pals | Your Profile</title>
  <link rel="stylesheet" href="/css/style.css" />

</head>

<body>
    <div id="header"></div>

    <main class="page-container">
        <h2 class="page-title">Register for an Account</h2>
        <p class="page-subtitle">Create a new account to start adopting pets.</p>

        <form id="registration-form" class="form-card">
            <div class="form-row">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName" required />
            </div>

            <div class="form-row">
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName" required />
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required />
            </div>

            <div class="form-row">
                <label for="confirmEmail">Confirm Email:</label>
                <input type="email" id="confirmEmail" name="confirmEmail" required />
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required />
            </div>

            <div class="form-row">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required />
            </div>


            <button type="submit" class="btn form-btn">Register</button>

            <p>Already have an account? <a href="/userForms/login.html">Login here</a>.</p>
        </form>
    </main>
    <div id="footer"></div>
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/registration.js"></script>
</body>
</html>

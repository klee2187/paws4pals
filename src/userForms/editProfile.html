<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paws4Pals | Your Profile</title>
  <link rel="stylesheet" href="/css/style.css" />

</head>

<body>
    <div id="header"></div>

    <main class="page-container">
        <h2 class="page-title">Edit Your Profile</h2>
        <p class="page-subtitle">Manage your profile information.</p>
            
        <form id="edit-profile-form" class="form-card">

            <div class="form-section">
                <h3 class="form-section-title">Choose an Avatar</h3>
                <div id="editAvatarGrid" class="edit-avatar-grid"></div>
                <input type="hidden" id="avatar" name="avatar" />
            </div>

            <div class="form-row">
                <label for="firstName" >First Name:</label>
                <input type="text" id="firstName" name="firstName" required />
            </div>
            <div class="form-row">
                <label for="lastName" >Last Name:</label>
                <input type="text" id="lastName" name="lastName" required/>
            </div>
            <div class="form-row">
                <label for="email" >Email:</label>
                <input type="email" id="email" name="email" required/>
            </div>
            <div class="form-row">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required />
            </div>
            <div class="form-row">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required />
            </div>
            <button type="submit" class="btn">Update Profile</button>
        </form>

    </main>

    <div id="footer"></div>

    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/editProfile.js"></script>

</body>
</html>

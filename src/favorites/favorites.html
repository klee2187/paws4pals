<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paws4Pals | Your Profile</title>
  <link rel="stylesheet" href="/css/style.css" />

</head>

<body>
    <div id="header"></div>

    <main class="page-container">
        <h2 class="page-title">Your Favorites</h2>
        <p class="page-subtitle">View and manage your favorite pets.</p>

        <template id="favoriteCardTemplate">
            <div class="favorite-card">
                <img src="" alt="Pet Image" class="favorite-image" />
                <h3 class="favorite-name"></h3>
                <p class="favorite-breed"></p>

                <a class="details-btn" href="#">View Details</a>

                <button class="favorite-toggle" data-id="">
                    <span class="heart-icon filled">♥</span>
                </button>
            </div>
        </template>

        <div id="favoritesList" class="favorites-grid"></div>
        
    </main>
    <div id="footer"></div>
    <script type="module" src="/js/main.js"></script>   
    <script type="module" src="/js/favorites.js"></script>
</body>
</html>

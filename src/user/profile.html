<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paws4Pals | Your Profile</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="module" src="/js/main.js"></script>
</head>

<body>
    <div id="header"></div>

    <main class="page-container">
        <h2 class="page-title">Your Profile</h2>
        <p class="page-subtitle">Manage your profile information.</p>

        <section class="profile-card">
            <div class="profile-header">
                <img src="/images/default-profile.png" alt="Profile Picture" class="profile-image" />
                <h3 id="profileName" class="profile-name">Profile Name</h3>
            </div>
            
            <form id="profile-form" class="form-card">
                <div class="form-row">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required />
                </div>

                <div class="form-row">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required />
                </div>

                <div class="form-row">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required />
                </div>

                <div class="form-row">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" required />
                </div>

                <div class="form-row">
                    <label for="address">Address:</label>
                    <input type="text" id="address" name="address" required />
                </div>

                <button type="submit" class="btn">Update Profile</button>

            <p><strong>Name:</strong> <span id="profile-name">John Doe</span></p>
            <p><strong>Email:</strong> <span id="profile-email">john.doe@example.com</span></p>
        </section>
    </main>

    <div id="footer"></div>
    
</body>
